<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeSlice Pro - MultiThread</title>
    
    <!-- OBRIGATÓRIO: coi-serviceworker.js deve estar na mesma pasta -->
    <script src="coi-serviceworker.js"></script>
    
    <style>
        :root { --blue: #0a84ff; --bg: #000; --card: #1c1c1e; }
        body { 
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg); color: white; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0; min-height: 100vh;
        }
        .card {
            background: var(--card); padding: 25px; border-radius: 20px;
            width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 { font-size: 1.6rem; margin: 0; color: var(--blue); }
        .badge { 
            background: #32d74b; color: black; font-size: 0.7rem; 
            padding: 2px 8px; border-radius: 10px; font-weight: bold;
            display: inline-block; margin: 10px 0 20px 0;
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.85rem; color: #8e8e93; margin-bottom: 8px; }
        input[type="file"], input[type="number"], input[type="range"] {
            width: 100%; padding: 12px; background: #2c2c2e;
            border: 1px solid #3a3a3c; border-radius: 12px; color: white;
            box-sizing: border-box; font-size: 1rem;
        }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--blue); }
        button {
            width: 100%; padding: 16px; background: var(--blue);
            border: none; border-radius: 12px; color: white;
            font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: 0.2s;
        }
        button:disabled { background: #3a3a3c; color: #8e8e93; opacity: 0.6; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #32d74b; }
        progress { width: 100%; height: 6px; margin-top: 15px; accent-color: var(--blue); width: 100%; }
        video { width: 100%; margin-top: 20px; border-radius: 12px; display: none; background: #000; }
    </style>
</head>
<body>

    <div class="card">
        <h1>TimeSlice Engine</h1>
        <div class="badge">MULTI-THREAD ATIVADO</div>
        
        <div class="input-group">
            <label>Vídeo de Entrada</label>
            <input type="file" id="uploader" accept="video/*" />
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="input-group" style="flex: 1;">
                <label>Fatias</label>
                <input type="number" id="slices" value="12" min="2" max="30">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Atraso (s)</label>
                <input type="number" id="delay" value="0.05" step="0.01">
            </div>
        </div>

        <div class="input-group">
            <label>Ângulo do Corte: <span id="angle-val">0</span>°</label>
            <input type="range" id="angle" min="-45" max="45" value="0" oninput="document.getElementById('angle-val').innerText = this.value">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="invert">
            <label style="margin-bottom:0">Inverter Fluxo Temporal</label>
        </div>

        <button id="btn">GERAR VÍDEO RÁPIDO</button>
        
        <div id="status">Aguardando...</div>
        <progress id="progress" value="0" max="100" style="display:none;"></progress>
        <video id="outputVideo" controls playsinline></video>
    </div>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        
        // Ativando motor Multi-Thread
        const ffmpeg = createFFmpeg({ 
            corePath: 'https://unpkg.com/@ffmpeg/core-mt@0.11.0/dist/ffmpeg-core.js',
            log: true 
        });

        function buildFilter(numSlices, delayStep, angle, invert) {
            const rad = (angle * Math.PI) / 180;
            const invRad = -rad;

            // Pré-processamento: Escala 720p para evitar estouro de memória
            let filter = `[0:v]scale=720:-1,split=${numSlices}`;
            let labels = "";
            for(let i=0; i<numSlices; i++) labels += `[v${i}]`;
            filter += `${labels};`;

            let stackLabels = "";
            for(let i=0; i<numSlices; i++) {
                let sliceIdx = invert ? (numSlices - 1 - i) : i;
                let startTrim = (sliceIdx * delayStep).toFixed(2);
                
                // Gira o vídeo -> Corta a fatia -> Gira de volta (o vídeo fica reto, a linha diagonal)
                filter += `[v${i}]rotate=${rad}:c=black:ow='hypot(iw,ih)':oh=ow,` +
                          `crop=iw:ih/${numSlices}:0:ih/${numSlices}*${i},` +
                          `rotate=${invRad}:c=none:ow=720:oh=ih*${numSlices},` +
                          `trim=start=${startTrim},setpts=PTS-STARTPTS[s${i}];`;
                
                stackLabels += `[s${i}]`;
            }
            
            filter += `${stackLabels}vstack=inputs=${numSlices}:shortest=1,format=yuv420p`;
            return filter;
        }

        const btn = document.getElementById('btn');
        btn.onclick = async () => {
            const file = document.getElementById('uploader').files[0];
            if (!file) return alert("Selecione um vídeo!");

            try {
                btn.disabled = true;
                const status = document.getElementById('status');
                const prog = document.getElementById('progress');
                const video = document.getElementById('outputVideo');
                video.style.display = "none";
                
                if (!ffmpeg.isLoaded()) {
                    status.innerText = "Iniciando motor multi-core...";
                    await ffmpeg.load();
                }

                status.innerText = "Processando vídeo...";
                ffmpeg.FS('writeFile', 'in.mp4', await fetchFile(file));

                ffmpeg.setProgress(({ ratio }) => {
                    prog.style.display = 'block';
                    prog.value = ratio * 100;
                    status.innerText = `Renderizando: ${(ratio * 100).toFixed(0)}%`;
                });

                const slices = parseInt(document.getElementById('slices').value);
                const delay = parseFloat(document.getElementById('delay').value);
                const angle = parseInt(document.getElementById('angle').value);
                const invert = document.getElementById('invert').checked;

                // MULTI-THREAD ATIVADO (Removido -threads 1)
                await ffmpeg.run(
                    '-i', 'in.mp4', 
                    '-vf', buildFilter(slices, delay, angle, invert), 
                    '-c:v', 'libx264', 
                    '-preset', 'ultrafast',
                    '-profile:v', 'baseline',
                    '-level', '3.0',
                    '-pix_fmt', 'yuv420p',
                    '-an',
                    'out.mp4'
                );

                const data = ffmpeg.FS('readFile', 'out.mp4');
                video.src = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                video.style.display = "block";
                status.innerText = "Sucesso!";

                ffmpeg.FS('unlink', 'in.mp4');
                ffmpeg.FS('unlink', 'out.mp4');

            } catch (e) {
                status.innerText = "Erro: O vídeo pode ser muito grande para o iPhone.";
                console.error(e);
            } finally {
                btn.disabled = false;
                document.getElementById('progress').style.display = 'none';
            }
        };
    </script>
</body>
</html>
