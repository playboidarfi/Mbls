<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSMB v1.0</title>
    <style>
        * { box-sizing: border-box; outline: none; }
        body { 
            margin: 0; 
            background: #000; 
            color: #fff; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Nav */
        nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo { font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #fff; }
        
        .actions { display: flex; gap: 20px; }
        .btn {
            background: none;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { border-color: #fff; background: #fff; color: #000; }
        .btn-export { background: #fff; color: #000; border: 1px solid #fff; }

        /* Viewport */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            background: #050505;
        }

        /* Bottom Controls */
        footer {
            padding: 30px 40px;
            border-top: 1px solid #222;
            display: flex;
            justify-content: center;
            gap: 60px;
        }

        .control-group { display: flex; flex-direction: column; width: 200px; }
        label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 15px; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #222;
            height: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        #status { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #444; text-transform: uppercase; }

        #fileIn { display: none; }
    </style>
</head>
<body>

<nav>
    <div class="logo">RSMB / WEB EDITION</div>
    <div class="actions">
        <button class="btn" onclick="document.getElementById('fileIn').click()">Open</button>
        <button class="btn btn-export" id="btnExport">Export</button>
    </div>
</nav>

<main>
    <canvas id="canvas"></canvas>
    <video id="vHidden" muted playsinline loop style="display:none"></video>
</main>

<div id="status">Ready</div>

<footer>
    <div class="control-group">
        <label>Motion Intensity</label>
        <input type="range" id="blur" min="0" max="0.95" step="0.01" value="0.5">
    </div>
    <div class="control-group">
        <label>Motion Sensitivity</label>
        <input type="range" id="sens" min="1" max="50" step="1" value="10">
    </div>
</footer>

<input type="file" id="fileIn" accept="video/*">

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const vHidden = document.getElementById('vHidden');
    const status = document.getElementById('status');
    const worker = new Worker('worker.js');
    
    let isProcessing = false;
    let chunks = [];

    document.getElementById('fileIn').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        vHidden.src = URL.createObjectURL(file);
        vHidden.onloadedmetadata = () => {
            const scale = Math.min(1, 800 / vHidden.videoWidth);
            canvas.width = vHidden.videoWidth * scale;
            canvas.height = vHidden.videoHeight * scale;
            vHidden.play();
            status.innerText = "Processing Real-time";
            render();
        };
    };

    function render() {
        if (!vHidden.paused && !vHidden.ended && !isProcessing) {
            isProcessing = true;
            ctx.drawImage(vHidden, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            worker.postMessage({
                imageData,
                settings: {
                    blur: parseFloat(document.getElementById('blur').value),
                    sensitivity: parseFloat(document.getElementById('sens').value)
                }
            }, [imageData.data.buffer]);
        }
        requestAnimationFrame(render);
    }

    worker.onmessage = (e) => {
        ctx.putImageData(e.data.imageData, 0, 0);
        isProcessing = false;
    };

    // Export Logic
    document.getElementById('btnExport').onclick = () => {
        status.innerText = "Recording...";
        chunks = [];
        const stream = canvas.captureStream(30);
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'rsmb_render.webm';
            a.click();
            status.innerText = "Done";
        };

        recorder.start();
        setTimeout(() => recorder.stop(), vHidden.duration * 1000 || 5000);
    };
</script>

</body>
</html>
