<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web RSMB Pro</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: #111; display: flex; justify-content: space-between; border-bottom: 2px solid #ff3e3e; }
        #canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        canvas { max-width: 100%; max-height: 100%; }
        #controls { background: #111; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .slider-box { display: flex; flex-direction: column; }
        label { font-size: 11px; text-transform: uppercase; margin-bottom: 8px; color: #888; }
        input[type=range] { accent-color: #ff3e3e; }
        .btn { background: #ff3e3e; border: none; color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; letter-spacing: 2px;">RSMB <span style="color:#ff3e3e">WEB</span></div>
    <input type="file" id="fileIn" hidden accept="video/*">
    <button class="btn" onclick="document.getElementById('fileIn').click()">CARREGAR VÍDEO</button>
</header>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
    <video id="vHidden" muted playsinline loop style="display:none"></video>
</div>

<div id="controls">
    <div class="slider-box">
        <label>Blur Amount (Intensidade)</label>
        <input type="range" id="blurAmount" min="0" max="5" step="0.1" value="1.5">
    </div>
    <div class="slider-box">
        <label>Sensitivity (Detecção de Movimento)</label>
        <input type="range" id="sensitivity" min="1" max="50" step="1" value="10">
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const vHidden = document.getElementById('vHidden');
    const worker = new Worker('worker.js');
    
    let isProcessing = false;

    document.getElementById('fileIn').onchange = (e) => {
        const file = e.target.files[0];
        vHidden.src = URL.createObjectURL(file);
        vHidden.onloadedmetadata = () => {
            // RSMB exige muito processamento, então limitamos a resolução de preview
            const scale = Math.min(1, 640 / vHidden.videoWidth);
            canvas.width = vHidden.videoWidth * scale;
            canvas.height = vHidden.videoHeight * scale;
            vHidden.play();
            requestAnimationFrame(render);
        };
    };

    function render() {
        if (!vHidden.paused && !vHidden.ended && !isProcessing) {
            isProcessing = true;
            
            // Pega o frame do vídeo
            ctx.drawImage(vHidden, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            // Envia para o Worker calcular o Motion Blur
            worker.postMessage({
                imageData: imageData,
                settings: {
                    blurAmount: parseFloat(document.getElementById('blurAmount').value),
                    sensitivity: parseFloat(document.getElementById('sensitivity').value)
                }
            }, [imageData.data.buffer]);
        }
        requestAnimationFrame(render);
    }

    worker.onmessage = (e) => {
        // Desenha o frame processado com RSMB de volta no canvas
        ctx.putImageData(e.data.imageData, 0, 0);
        isProcessing = false;
    };
</script>

</body>
</html>
