<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeSlice Engine - Angle Pro</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        :root { --blue: #0a84ff; --bg: #000; --card: #1c1c1e; }
        body { 
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg); color: white; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0; min-height: 100vh;
        }
        .card {
            background: var(--card); padding: 25px; border-radius: 20px;
            width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 { font-size: 1.6rem; margin: 0 0 15px 0; color: var(--blue); }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.85rem; color: #8e8e93; margin-bottom: 8px; }
        input[type="file"], input[type="number"], input[type="range"] {
            width: 100%; padding: 12px; background: #2c2c2e;
            border: 1px solid #3a3a3c; border-radius: 12px; color: white;
            box-sizing: border-box; font-size: 1rem;
        }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--blue); }
        button {
            width: 100%; padding: 16px; background: var(--blue);
            border: none; border-radius: 12px; color: white;
            font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: 0.2s; margin-top: 10px;
        }
        button:disabled { background: #3a3a3c; color: #8e8e93; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #32d74b; }
        progress { width: 100%; height: 6px; margin-top: 15px; accent-color: var(--blue); }
        video { width: 100%; margin-top: 20px; border-radius: 12px; display: none; background: #000; }
    </style>
</head>
<body>

    <div class="card">
        <h1>TimeSlice Engine</h1>
        
        <div class="input-group">
            <label>Vídeo de Entrada</label>
            <input type="file" id="uploader" accept="video/*" />
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="input-group" style="flex: 1;">
                <label>Fatias</label>
                <input type="number" id="slices" value="8" min="2" max="20">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Atraso (s)</label>
                <input type="number" id="delay" value="0.05" step="0.01">
            </div>
        </div>

        <div class="input-group">
            <label>Ângulo do Corte: <span id="angle-val">0</span>°</label>
            <input type="range" id="angle" min="-90" max="90" value="0" oninput="document.getElementById('angle-val').innerText = this.value">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="invert">
            <label style="margin-bottom:0">Inverter Fluxo Temporal</label>
        </div>

        <button id="btn">GERAR VÍDEO</button>
        
        <div id="status">Pronto</div>
        <progress id="progress" value="0" max="100" style="display:none;"></progress>
        <video id="outputVideo" controls playsinline></video>
    </div>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ 
            corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
            log: true 
        });

        // Função para construir o filtro de fatias angulares
        function buildDiagonalFilter(numSlices, delayStep, angle, invert, w, h) {
            const rad = (angle * Math.PI) / 180;
            const invRad = -rad;

            let filter = `[0:v]scale=720:1280,split=${numSlices}`;
            let labels = "";
            for(let i=0; i<numSlices; i++) labels += `[v${i}]`;
            filter += `${labels};`;

            let overlayChain = "";
            for(let i=0; i<numSlices; i++) {
                let sliceIdx = invert ? (numSlices - 1 - i) : i;
                let startTrim = (sliceIdx * delayStep).toFixed(2);
                
                // A MÁGICA:
                // 1. Rotaciona para o ângulo desejado
                // 2. Corta a fatia horizontalmente
                // 3. Rotaciona DE VOLTA para ficar reto
                // 4. Crop final para garantir que o tamanho seja 720x1280
                let sliceName = `s${i}`;
                filter += `[v${i}]rotate=${rad}:c=black:ow='hypot(iw,ih)':oh=ow,` +
                          `crop=iw:ih/${numSlices}:0:ih/${numSlices}*${i},` +
                          `rotate=${invRad}:c=none:ow=720:oh=1280,` +
                          `trim=start=${startTrim},setpts=PTS-STARTPTS[${sliceName}];`;
                
                if (i === 0) {
                    overlayChain += `[${sliceName}]`;
                } else {
                    overlayChain += `[${sliceName}]overlay=shortest=1[ov${i}];`;
                    if (i < numSlices - 1) overlayChain += `[ov${i}]`;
                }
            }
            
            filter += overlayChain.endsWith(';') ? overlayChain : overlayChain + `format=yuv420p`;
            return filter;
        }

        const btn = document.getElementById('btn');
        btn.onclick = async () => {
            const file = document.getElementById('uploader').files[0];
            if (!file) return alert("Selecione um vídeo!");

            try {
                btn.disabled = true;
                const status = document.getElementById('status');
                const prog = document.getElementById('progress');
                const video = document.getElementById('outputVideo');
                video.style.display = "none";
                
                if (!ffmpeg.isLoaded()) {
                    status.innerText = "Iniciando...";
                    await ffmpeg.load();
                }

                status.innerText = "Lendo vídeo...";
                ffmpeg.FS('writeFile', 'in.mp4', await fetchFile(file));

                ffmpeg.setProgress(({ ratio }) => {
                    prog.style.display = 'block';
                    prog.value = ratio * 100;
                    status.innerText = `Processando: ${(ratio * 100).toFixed(0)}%`;
                });

                const slices = parseInt(document.getElementById('slices').value);
                const delay = parseFloat(document.getElementById('delay').value);
                const angle = parseInt(document.getElementById('angle').value);
                const invert = document.getElementById('invert').checked;

                await ffmpeg.run(
                    '-i', 'in.mp4', 
                    '-vf', buildDiagonalFilter(slices, delay, angle, invert, 720, 1280), 
                    '-c:v', 'libx264', 
                    '-preset', 'ultrafast',
                    '-threads', '1',
                    '-pix_fmt', 'yuv420p',
                    '-an',
                    'out.mp4'
                );

                const data = ffmpeg.FS('readFile', 'out.mp4');
                video.src = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                video.style.display = "block";
                status.innerText = "Sucesso!";

            } catch (e) {
                status.innerText = "Erro: Reduza o número de fatias.";
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
