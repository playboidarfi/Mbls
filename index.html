<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSMB Pro - Web Engine</title>
    
    <!-- Necessário para Multi-thread no GitHub Pages -->
    <script src="coi-serviceworker.js"></script>
    
    <style>
        :root {
            --bg: #000; --card: #111; --text: #fff; --primary: #fff;
            --border: #222;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg); color: var(--text); 
            margin: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 400px; padding: 40px 20px;
            text-align: center;
        }

        h1 { font-size: 12px; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 40px; color: #666; }

        .control-group { margin-bottom: 30px; text-align: left; }
        label { font-size: 10px; text-transform: uppercase; color: #444; letter-spacing: 1px; display: block; margin-bottom: 15px; }

        input[type="file"] {
            width: 100%; padding: 15px; background: #0a0a0a; border: 1px solid var(--border);
            color: #444; font-size: 10px; cursor: pointer;
        }

        input[type="range"] {
            width: 100%; height: 2px; background: #222; appearance: none; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: pointer;
        }

        button {
            width: 100%; padding: 15px; background: #fff; color: #000;
            border: none; font-size: 10px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        button:disabled { background: #222; color: #444; }

        #status { font-size: 9px; text-transform: uppercase; margin-top: 20px; color: #ff3b30; letter-spacing: 1px; }
        
        video { width: 100%; margin-top: 30px; border: 1px solid #222; display: none; }

        progress { width: 100%; height: 2px; margin-top: 10px; display: none; appearance: none; }
        progress::-webkit-progress-bar { background: #111; }
        progress::-webkit-progress-value { background: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>RSMB Engine V1</h1>
        
        <div class="control-group">
            <label>Select Footage</label>
            <input type="file" id="uploader" accept="video/*" />
        </div>

        <div class="control-group">
            <label>Motion Blur Intensity: <span id="val-blur">10</span></label>
            <input type="range" id="blur" min="2" max="30" value="10">
        </div>

        <div class="control-group">
            <label>Shutter Smoothness</label>
            <input type="range" id="smooth" min="1" max="10" value="5">
        </div>

        <button id="render-btn">Start Rendering</button>
        
        <div id="status">Engine Ready</div>
        <progress id="progress" value="0" max="100"></progress>
        
        <video id="outputVideo" controls playsinline></video>
    </div>

    <!-- Carrega a biblioteca FFmpeg -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ 
            log: true,
            corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
        });

        document.getElementById('blur').oninput = (e) => document.getElementById('val-blur').innerText = e.target.value;

        document.getElementById('render-btn').onclick = async () => {
            const file = document.getElementById('uploader').files[0];
            if (!file) {
                alert("Please select a video first.");
                return;
            }

            const btn = document.getElementById('render-btn');
            const status = document.getElementById('status');
            const prog = document.getElementById('progress');
            const video = document.getElementById('outputVideo');

            try {
                btn.disabled = true;
                video.style.display = "none";
                
                if (!ffmpeg.isLoaded()) {
                    status.innerText = "Booting Engine...";
                    await ffmpeg.load();
                }

                status.innerText = "Loading Video...";
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

                ffmpeg.setProgress(({ ratio }) => {
                    prog.style.display = 'block';
                    prog.value = ratio * 100;
                    status.innerText = `Rendering: ${(ratio * 100).toFixed(0)}%`;
                });

                const frames = document.getElementById('blur').value;
                
                // Lógica de RSMB via FFmpeg: tmix (Temporal Mix)
                // O segredo do RSMB é a mistura de frames consecutivos para criar o rastro.
                // scale=trunc(iw/2)*2... garante compatibilidade com players mobile.
                const filter = `tmix=frames=${frames}:weights='1',scale=trunc(iw/2)*2:trunc(ih/2)*2`;

                await ffmpeg.run(
                    '-i', 'input.mp4',
                    '-vf', filter,
                    '-c:v', 'libx264',
                    '-preset', 'ultrafast',
                    '-crf', '23',
                    '-pix_fmt', 'yuv420p',
                    'output.mp4'
                );

                const data = ffmpeg.FS('readFile', 'output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                video.src = URL.createObjectURL(blob);
                video.style.display = "block";
                status.innerText = "Render Complete";

                // Limpa memória virtual
                ffmpeg.FS('unlink', 'input.mp4');
                ffmpeg.FS('unlink', 'output.mp4');

            } catch (e) {
                console.error(e);
                status.innerText = "Render Error: Check Console";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
