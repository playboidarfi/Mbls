<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    const vHidden = document.getElementById('vHidden');
    const fileIn = document.getElementById('fileIn');
    
    let worker;
    try {
        worker = new Worker('processor.js');
    } catch (e) {
        alert("Erro ao carregar o processador. Certifique-se de estar usando um servidor (GitHub Pages ou Local Server).");
    }

    let isProcessing = false;

    fileIn.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        vHidden.src = url;
        vHidden.onloadedmetadata = () => {
            // No mobile, o 4k trava. Usamos 720p para o preview.
            const aspect = vHidden.videoWidth / vHidden.videoHeight;
            canvas.width = 720;
            canvas.height = 720 / aspect;
            vHidden.play();
            requestAnimationFrame(renderLoop);
        };
    };

    function renderLoop() {
        if (!vHidden.paused && !vHidden.ended && !isProcessing) {
            isProcessing = true;
            
            // Desenha o frame original
            ctx.drawImage(vHidden, 0, 0, canvas.width, canvas.height);
            
            // Pega os dados
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Captura os valores dos sliders
            const settings = {
                lift: parseFloat(document.getElementById('lift').value),
                gamma: parseFloat(document.getElementById('gamma').value),
                gain: parseFloat(document.getElementById('gain').value),
                halation: parseFloat(document.getElementById('halation').value),
                vignette: parseFloat(document.getElementById('vignette').value),
                gain: {
                    r: parseFloat(document.getElementById('gain').value) * parseFloat(document.getElementById('tintR').value),
                    g: parseFloat(document.getElementById('gain').value) * parseFloat(document.getElementById('tintG').value),
                    b: parseFloat(document.getElementById('gain').value) * parseFloat(document.getElementById('tintB').value)
                }
            };

            worker.postMessage({ imageData, settings }, [imageData.data.buffer]);
        }
        requestAnimationFrame(renderLoop);
    }

    worker.onmessage = (e) => {
        ctx.putImageData(e.data.imageData, 0, 0);
        isProcessing = false;
    };

    // Forçar atualização quando mexer nos sliders (mesmo com vídeo parado)
    document.querySelectorAll('input[type=range]').forEach(input => {
        input.addEventListener('input', () => {
            if (vHidden.paused && !isProcessing) {
                isProcessing = true;
                ctx.drawImage(vHidden, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                worker.postMessage({ imageData, settings: {
                    lift: parseFloat(document.getElementById('lift').value),
                    gamma: parseFloat(document.getElementById('gamma').value),
                    gain: parseFloat(document.getElementById('gain').value),
                    halation: parseFloat(document.getElementById('halation').value),
                    vignette: parseFloat(document.getElementById('vignette').value),
                    gain: {
                        r: parseFloat(document.getElementById('gain').value) * parseFloat(document.getElementById('tintR').value),
                        g: parseFloat(document.getElementById('gain').value) * parseFloat(document.getElementById('tintG').value),
                        b: parseFloat(document.getElementById('gain').value) * parseFloat(document.getElementById('tintB').value)
                    }
                }}, [imageData.data.buffer]);
            }
        });
    });
</script>
