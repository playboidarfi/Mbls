<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Simulator Pro</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        :root { --vhs-green: #00ff41; --vhs-bg: #050505; }
        body { 
            background: var(--vhs-bg); color: var(--vhs-green); 
            font-family: 'Courier New', monospace; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 400px; border: 1px solid var(--vhs-green); padding: 20px; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
        h1 { font-size: 1.2rem; text-align: center; border-bottom: 1px solid var(--vhs-green); padding-bottom: 10px; }
        .control { margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: var(--vhs-green); background: #222; }
        input[type="file"] { width: 100%; font-size: 0.7rem; margin-bottom: 20px; }
        button { 
            width: 100%; padding: 15px; background: var(--vhs-green); color: #000; 
            border: none; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        button:disabled { background: #004411; color: #002200; }
        #status { font-size: 0.7rem; margin-top: 15px; text-align: center; }
        video { width: 100%; margin-top: 20px; border: 1px solid #333; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>SIGNAL_PROCESSOR_V1</h1>
    
    <input type="file" id="uploader" accept="video/*">

    <div class="control">
        <label>Chroma Bleed (Vazamento U/V): <span id="bleed-val">6</span></label>
        <input type="range" id="bleed" min="0" max="15" value="6">
    </div>

    <div class="control">
        <label>Bandwidth (Lown-Pass Filter): <span id="bandwidth-val">4</span></label>
        <input type="range" id="bandwidth" min="0" max="10" value="4">
    </div>

    <div class="control">
        <label>Tape Noise (Magnetic interference): <span id="noise-val">12</span></label>
        <input type="range" id="noise" min="0" max="40" value="12">
    </div>

    <button id="btn">RECONSTRUCT SIGNAL</button>
    <div id="status">IDLE...</div>
    <video id="outputVideo" controls playsinline></video>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ 
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
        log: false 
    });

    // Função que reconstrói a imagem baseada em sinal analógico
    function buildAnalogFilter(bleed, bandwidth, noise) {
        // 1. Redução para resolução NTSC (Simulando a largura de banda da fita)
        let f = `scale=640:480,`;

        // 2. Separação YUV e Chroma Bleed (Passo 1 do Signal)
        // Desfocamos apenas os canais U e V (cor) mantendo o Y (brilho) nítido
        f += `format=yuv444p,boxblur=luma_radius=0:luma_power=1:chroma_radius=${bleed}:chroma_power=1,`;

        // 3. Bandwidth Control (Passo 4 do Signal)
        // Usamos um desfoque apenas horizontal (sizeh) para simular o limite de dados por linha
        if (bandwidth > 0) {
            f += `avgblur=sizeh=${bandwidth}:sizev=0,`;
        }

        // 4. Modulação e Ruído Magnético (Passo 3 do Signal)
        // noise=allf=t: Simula ruído que muda a cada frame (temporal)
        f += `noise=alls=${noise}:allf=t+u,`;

        // 5. Simulação de Head Switching (A barra distorcida no rodapé)
        // Cortamos 8 pixels do fundo e substituímos por ruído puro
        f += `drawbox=y=ih-8:h=8:color=black@0.5:t=fill,`;

        // Finalização
        f += `hue=s=0.9,format=yuv420p`;
        return f;
    }

    const btn = document.getElementById('btn');
    btn.onclick = async () => {
        const file = document.getElementById('uploader').files[0];
        if (!file) return;
        
        btn.disabled = true;
        const status = document.getElementById('status');
        if (!ffmpeg.isLoaded()) await ffmpeg.load();

        status.innerText = "ENCODING SIGNAL...";
        ffmpeg.FS('writeFile', 'in.mp4', await fetchFile(file));

        const bleed = document.getElementById('bleed').value;
        const bw = document.getElementById('bandwidth').value;
        const ns = document.getElementById('noise').value;

        await ffmpeg.run(
            '-i', 'in.mp4',
            '-vf', buildAnalogFilter(bleed, bw, ns),
            '-c:v', 'libx264',
            '-preset', 'ultrafast',
            '-threads', '1',
            'out.mp4'
        );

        const data = ffmpeg.FS('readFile', 'out.mp4');
        const video = document.getElementById('outputVideo');
        video.src = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
        video.style.display = "block";
        status.innerText = "SIGNAL RECONSTRUCTED.";
        btn.disabled = false;
    };

    // Atualizadores de label
    ['bleed','bandwidth','noise'].forEach(id => {
        document.getElementById(id).oninput = (e) => {
            document.getElementById(id+'-val').innerText = e.target.value;
        }
    });
</script>
</body>
</html>
