<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSMB PRO / ULTRA BLUR</title>
    
    <script src="coi-serviceworker.js"></script>
    
    <style>
        * { box-sizing: border-box; outline: none; }
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }

        nav {
            padding: 30px 40px; display: flex;
            justify-content: space-between; align-items: center;
        }

        .logo { font-size: 11px; font-weight: 900; letter-spacing: 3px; color: #333; }
        
        .btn {
            background: none; border: 1px solid #222; color: #fff;
            padding: 10px 20px; font-size: 10px; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { border-color: #fff; }
        .btn-render { background: #fff; color: #000; border: none; font-weight: bold; }

        main {
            flex: 1; display: flex; align-items: center;
            justify-content: center; padding: 20px;
        }
        canvas, video { max-width: 100%; max-height: 80vh; border-radius: 4px; }

        footer {
            padding: 40px; display: flex; justify-content: center; gap: 50px;
            background: #000;
        }

        .control { display: flex; flex-direction: column; width: 180px; }
        label { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #444; margin-bottom: 15px; }
        
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: #111; height: 1px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px;
            background: #fff; border-radius: 50%; cursor: pointer;
        }

        #status { 
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #ff3b30;
        }
        progress { width: 200px; height: 1px; position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); appearance: none; border: none; background: #111; display: none; }
        progress::-webkit-progress-value { background: #fff; }
    </style>
</head>
<body>

<nav>
    <div class="logo">MOTION BLUR / RSMB V2</div>
    <div style="display:flex; gap:15px">
        <button class="btn" onclick="document.getElementById('fileIn').click()">Open</button>
        <button class="btn btn-render" id="renderBtn">Render</button>
    </div>
</nav>

<main>
    <video id="outputVideo" controls playsinline></video>
    <div id="status">Engine Ready</div>
    <progress id="progress" value="0" max="100"></progress>
</nav>

<footer>
    <div class="control">
        <label>Blur Intensity</label>
        <input type="range" id="blur" min="4" max="24" value="12">
    </div>
    <div class="control">
        <label>Motion Flow</label>
        <input type="range" id="flow" min="1" max="10" value="5">
    </div>
</footer>

<input type="file" id="fileIn" accept="video/*" style="display:none">

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ 
        log: true, 
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    const renderBtn = document.getElementById('renderBtn');
    const status = document.getElementById('status');
    const prog = document.getElementById('progress');
    const video = document.getElementById('outputVideo');

    document.getElementById('fileIn').onchange = (e) => {
        status.innerText = "Video Loaded";
    };

    renderBtn.onclick = async () => {
        const file = document.getElementById('fileIn').files[0];
        if (!file) return;

        renderBtn.disabled = true;
        
        if (!ffmpeg.isLoaded()) {
            status.innerText = "Booting Engine...";
            await ffmpeg.load();
        }

        status.innerText = "Mounting Source...";
        ffmpeg.FS('writeFile', 'in.mp4', await fetchFile(file));

        ffmpeg.setProgress(({ ratio }) => {
            prog.style.display = 'block';
            prog.value = ratio * 100;
            status.innerText = `Rendering: ${(ratio * 100).toFixed(0)}%`;
        });

        const intensity = document.getElementById('blur').value;
        
        // A MÁGICA PARA TIRAR OS FANTASMAS:
        // 1. minterpolate=fps=120 -> Cria frames intermediários para suavizar o rastro.
        // 2. tmix -> Mistura esses novos frames.
        // 3. scale -> Garante que o MP4 seja compatível.
        const filter = `scale=trunc(iw/2)*2:trunc(ih/2)*2,minterpolate=fps=120:mi_mode=blend,tmix=frames=${intensity}:weights='1'`;

        await ffmpeg.run(
            '-i', 'in.mp4',
            '-vf', filter,
            '-c:v', 'libx264',
            '-preset', 'ultrafast',
            '-crf', '22',
            '-pix_fmt', 'yuv420p',
            'out.mp4'
        );

        const data = ffmpeg.FS('readFile', 'out.mp4');
        video.src = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
        video.style.display = "block";
        status.innerText = "Complete";
        prog.style.display = 'none';
        renderBtn.disabled = false;
        
        ffmpeg.FS('unlink', 'in.mp4');
        ffmpeg.FS('unlink', 'out.mp4');
    };
</script>

</body>
</html>
