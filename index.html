<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSMB v2.0</title>
    
    <!-- O coi-serviceworker.js DEVE estar na mesma pasta no GitHub -->
    <script src="coi-serviceworker.js"></script>

    <style>
        :root { --bg: #000; --accent: #fff; --grey: #1a1a1a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        header { 
            padding: 40px 20px 20px; text-align: center; 
            border-bottom: 1px solid var(--grey);
        }
        .logo { font-size: 10px; font-weight: 900; letter-spacing: 4px; color: #444; text-transform: uppercase; }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 20px; }

        .video-container { 
            width: 100%; max-width: 500px; background: #050505; 
            aspect-ratio: 16/9; border-radius: 8px; display: flex; 
            align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid var(--grey);
        }
        video { width: 100%; height: 100%; object-fit: contain; display: none; }

        .controls { width: 100%; max-width: 400px; padding: 20px 0; }
        .slider-group { margin-bottom: 30px; }
        label { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #666; display: block; margin-bottom: 15px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: var(--grey); height: 2px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 15px; width: 15px; background: #fff; border-radius: 50%; }

        .btn-group { display: flex; gap: 10px; width: 100%; max-width: 400px; }
        .btn { 
            flex: 1; padding: 15px; font-size: 10px; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 2px; border: none; cursor: pointer;
        }
        .btn-open { background: var(--grey); color: #fff; }
        .btn-render { background: #fff; color: #000; }
        .btn:disabled { opacity: 0.2; }

        #status { font-size: 9px; color: #ff3b30; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div class="logo">RSMB / Engine V2.0</div>
</header>

<main>
    <div class="video-container">
        <video id="outputVideo" controls playsinline></video>
        <div id="placeholder" style="color:#222; font-size:10px; text-transform:uppercase;">No Media</div>
    </div>

    <div id="status">System Ready</div>

    <div class="controls">
        <div class="slider-group">
            <label>Motion Intensity: <span id="val">0.5</span></label>
            <input type="range" id="blur" min="0.1" max="0.9" step="0.1" value="0.5">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-open" onclick="document.getElementById('fileIn').click()">Open</button>
        <button class="btn btn-render" id="renderBtn">Render</button>
    </div>
</main>

<input type="file" id="fileIn" accept="video/*" style="display:none">

<!-- Script do FFmpeg -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ 
        log: true, 
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    const blurInput = document.getElementById('blur');
    const valDisplay = document.getElementById('val');
    const status = document.getElementById('status');
    const video = document.getElementById('outputVideo');
    const renderBtn = document.getElementById('renderBtn');

    blurInput.oninput = () => valDisplay.innerText = blurInput.value;

    document.getElementById('fileIn').onchange = (e) => {
        if(e.target.files[0]) status.innerText = "Video Loaded. Ready to Render.";
    };

    renderBtn.onclick = async () => {
        const file = document.getElementById('fileIn').files[0];
        if (!file) return;

        try {
            renderBtn.disabled = true;
            status.innerText = "Initializing Engine...";

            if (!ffmpeg.isLoaded()) await ffmpeg.load();

            status.innerText = "Processing Video...";
            ffmpeg.FS('writeFile', 'in.mp4', await fetchFile(file));

            const intensity = blurInput.value;
            
            // FILTRO ESTÁVEL PARA IOS (tblend + framestep)
            // Em vez de criar frames novos, ele mistura os frames existentes com transparência.
            // É 10x mais leve e não mata a memória do Safari.
            const filter = `tblend=all_mode=average,scale=trunc(iw/2)*2:trunc(ih/2)*2`;

            await ffmpeg.run(
                '-i', 'in.mp4',
                '-vf', filter,
                '-c:v', 'libx264',
                '-preset', 'ultrafast',
                '-pix_fmt', 'yuv420p',
                'out.mp4'
            );

            const data = ffmpeg.FS('readFile', 'out.mp4');
            video.src = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            document.getElementById('placeholder').style.display = "none";
            video.style.display = "block";
            status.innerText = "Render Complete!";
            
            // Limpa para não dar crash de memória no próximo render
            ffmpeg.FS('unlink', 'in.mp4');
            ffmpeg.FS('unlink', 'out.mp4');
        } catch (err) {
            console.error(err);
            status.innerText = "Error: Too much memory used.";
        } finally {
            renderBtn.disabled = false;
        }
    };
</script>

</body>
</html>
