<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Processor V1 - Final Fix</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        :root { --vhs-green: #00ff41; --vhs-bg: #050505; }
        body { 
            background: var(--vhs-bg); color: var(--vhs-green); 
            font-family: 'Courier New', monospace; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 400px; border: 1px solid var(--vhs-green); padding: 20px; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
        h1 { font-size: 1.2rem; text-align: center; border-bottom: 1px solid var(--vhs-green); padding-bottom: 10px; }
        .control { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: var(--vhs-green); }
        input[type="file"] { width: 100%; font-size: 0.7rem; margin-bottom: 20px; color: white; }
        button { 
            width: 100%; padding: 15px; background: var(--vhs-green); color: #000; 
            border: none; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        button:disabled { background: #004411; color: #002200; }
        #status { font-size: 0.7rem; margin-top: 15px; text-align: center; color: #aaa; }
        video { width: 100%; margin-top: 20px; border: 1px solid #333; display: none; background: #000; }
        #download-link { display: none; color: white; margin-top: 10px; text-decoration: underline; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>SIGNAL_PROCESSOR_V1</h1>
    
    <div class="control">
        <label>1. Carregar Vídeo</label>
        <input type="file" id="uploader" accept="video/*">
    </div>

    <div class="control">
        <label>Chroma Bleed: <span id="bleed-val">6</span></label>
        <input type="range" id="bleed" min="0" max="15" value="6" oninput="document.getElementById('bleed-val').innerText=this.value">
    </div>

    <div class="control">
        <label>Bandwidth (Nitidez): <span id="bandwidth-val">4</span></label>
        <input type="range" id="bandwidth" min="0" max="10" value="4" oninput="document.getElementById('bandwidth-val').innerText=this.value">
    </div>

    <div class="control">
        <label>Tape Noise: <span id="noise-val">12</span></label>
        <input type="range" id="noise" min="0" max="40" value="12" oninput="document.getElementById('noise-val').innerText=this.value">
    </div>

    <button id="btn">RECONSTRUCT SIGNAL</button>
    <div id="status">AGUARDANDO...</div>
    
    <!-- Muted é importante para o Safari permitir o play automático de blobs -->
    <video id="outputVideo" controls playsinline muted></video>
    <a id="download-link">Baixar Vídeo Manualmente</a>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ 
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
        log: true 
    });

    function buildAnalogFilter(bleed, bandwidth, noise) {
        // -2 garante que a largura seja 480 e a altura seja calculada como um número PAR (exigência do H.264)
        let f = `scale=480:-2,`; 
        f += `format=yuv444p,boxblur=luma_radius=0:luma_power=1:chroma_radius=${bleed}:chroma_power=1,`;
        if (bandwidth > 0) f += `avgblur=sizeh=${bandwidth}:sizev=0,`;
        f += `noise=alls=${noise}:allf=t+u,`;
        f += `drawbox=y=ih-6:h=6:color=black@0.4:t=fill,`;
        f += `format=yuv420p`;
        return f;
    }

    const btn = document.getElementById('btn');
    btn.onclick = async () => {
        const file = document.getElementById('uploader').files[0];
        if (!file) return;
        
        btn.disabled = true;
        const status = document.getElementById('status');
        const video = document.getElementById('outputVideo');
        const dlLink = document.getElementById('download-link');
        
        video.style.display = "none";
        dlLink.style.display = "none";

        if (!ffmpeg.isLoaded()) {
            status.innerText = "CARREGANDO MOTOR...";
            await ffmpeg.load();
        }

        status.innerText = "LENDO SINAL...";
        ffmpeg.FS('writeFile', 'input_file.mp4', await fetchFile(file));

        const bleed = document.getElementById('bleed').value;
        const bw = document.getElementById('bandwidth').value;
        const ns = document.getElementById('noise').value;

        status.innerText = "RECONSTRUINDO... (AGUARDE)";

        try {
            await ffmpeg.run(
                '-i', 'input_file.mp4',
                '-vf', buildAnalogFilter(bleed, bw, ns),
                '-c:v', 'libx264',
                '-preset', 'ultrafast',
                '-tune', 'zerolatency',
                '-profile:v', 'baseline', 
                '-level', '3.0',
                '-pix_fmt', 'yuv420p',
                '-threads', '1',
                '-an', // Removendo áudio para evitar erros de codec/sync que travam o Safari
                '-movflags', '+faststart',
                'output_file.mp4'
            );

            const data = ffmpeg.FS('readFile', 'output_file.mp4');
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            
            video.src = url;
            video.style.display = "block";
            
            dlLink.href = url;
            dlLink.download = "vhs_signal.mp4";
            dlLink.style.display = "block";
            
            status.innerText = "SINAL RECONSTRUÍDO!";
        } catch (e) {
            status.innerText = "ERRO NO PROCESSAMENTO.";
            console.error(e);
        } finally {
            btn.disabled = false;
            ffmpeg.FS('unlink', 'input_file.mp4');
            ffmpeg.FS('unlink', 'output_file.mp4');
        }
    };
</script>
</body>
</html>
